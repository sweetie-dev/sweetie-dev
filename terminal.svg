<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="tt td">
<title id="tt">Emily.exe — terminal sobre mim</title><desc id="td">Terminal roxo com estrelas, brilho, código colorido e informações sobre Emily Nivea em português.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#120D20"/><stop offset=".6" stop-color="#26163F"/><stop offset="1" stop-color="#120F24"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#B58BFC" stop-opacity=".42"/><stop offset="1" stop-color="#B58BFC" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#07040E" flood-opacity=".7"/></filter>
<style>
.star{animation:twinkle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.star:nth-child(2n){animation-delay:-1.4s}
@keyframes twinkle{from{opacity:.18;transform:scale(.6)}to{opacity:1;transform:scale(1.3)}}
.halo{animation:float 9s ease-in-out infinite alternate}@keyframes float{to{transform:translate(-24px,14px)}}
.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.online{animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.line{animation:appear .8s ease-out both}.l2{animation-delay:.2s}.l3{animation-delay:.4s}.l4{animation-delay:.6s}.l5{animation-delay:.8s}.l6{animation-delay:1s}.l7{animation-delay:1.2s}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<rect width="1000" height="460" rx="17" fill="url(#bg)"/>
<circle class="halo" cx="810" cy="200" r="250" fill="url(#glow)"/>
<g fill="#E6C8FF"><circle class="star" cx="32" cy="78" r="2"/><circle class="star" cx="970" cy="65" r="2"/><circle class="star" cx="905" cy="380" r="2"/><circle class="star" cx="690" cy="45" r="1.5"/><circle class="star" cx="450" cy="415" r="1.5"/></g>
<rect x="28" y="23" width="944" height="414" rx="16" fill="#191428" stroke="#8B69AC" filter="url(#shadow)"/>
<path d="M44 23h912q16 0 16 16v40H28V39q0-16 16-16z" fill="#3C2A53"/>
<circle cx="52" cy="50" r="7" fill="#E99BAE"/><circle cx="76" cy="50" r="7" fill="#F1CE98"/><circle cx="100" cy="50" r="7" fill="#A8D7BF"/>
<text x="500" y="56" text-anchor="middle" font-family="monospace" font-size="16" fill="#F1DFFF">terminal — sobre_mim.js</text>
<circle class="online" cx="914" cy="51" r="5" fill="#A8E4C1"/><text x="926" y="55" font-family="monospace" font-size="11" fill="#BFEAD5">online</text>
<g font-family="monospace">
<g class="line"><text x="62" y="117" fill="#A7E0C0" font-size="17">emily@midnight:~$</text><text x="276" y="117" fill="#F0DDFB" font-size="17">cat sobre_mim.js</text></g>
<g class="line l2"><text x="62" y="160" fill="#D5A8FF" font-size="18">const</text><text x="126" y="160" fill="#F4E6FF" font-size="18">emily = {</text></g>
<g class="line l3"><text x="100" y="200" fill="#F0A9D5" font-size="17">nome:</text><text x="218" y="200" fill="#B7EBCF" font-size="17">"Emily Nivea",</text></g>
<g class="line l4"><text x="100" y="239" fill="#F0A9D5" font-size="17">profissao:</text><text x="218" y="239" fill="#B7EBCF" font-size="17">"Desenvolvedora de Software",</text></g>
<g class="line l5"><text x="100" y="278" fill="#F0A9D5" font-size="17">formacao:</text><text x="218" y="278" fill="#B7EBCF" font-size="17">"Análise e Desenvolvimento de Sistemas",</text></g>
<g class="line l6"><text x="100" y="317" fill="#F0A9D5" font-size="17">paixoes:</text><text x="218" y="317" fill="#B7EBCF" font-size="17">["front-end", "design", "código criativo"],</text></g>
<g class="line l7"><text x="100" y="356" fill="#F0A9D5" font-size="17">lema:</text><text x="218" y="356" fill="#B7EBCF" font-size="17">"Transformando ideias em experiências ♡"</text></g>
<text x="62" y="388" fill="#F4E6FF" font-size="18">};</text>
<text x="62" y="416" fill="#A7E0C0" font-size="16">emily@midnight:~$</text><rect class="cursor" x="263" y="400" width="10" height="19" fill="#D9B7FA"/>
</g>
