
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#100D20"/>
    <stop offset=".55" stop-color="#25183F"/>
    <stop offset="1" stop-color="#111024"/>
  </linearGradient>
  <linearGradient id="panel" x2="0" y2="1">
    <stop stop-color="#302345"/>
    <stop offset="1" stop-color="#1B172D"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#080612" flood-opacity=".7"/>
  </filter>
</defs>

<rect width="1000" height="570" rx="18" fill="url(#bg)"/>

<!-- Stars -->
<g fill="#E6C8FF" opacity=".65">
  <circle cx="90" cy="65" r="2"/>
  <circle cx="235" cy="108" r="1.5"/>
  <circle cx="470" cy="54" r="2"/>
  <circle cx="735" cy="84" r="1.5"/>
  <circle cx="910" cy="165" r="2"/>
  <circle cx="580" cy="445" r="1.5"/>
  <circle cx="315" cy="385" r="1.5"/>
  <circle cx="850" cy="390" r="2"/>
</g>

<circle cx="770" cy="260" r="170" fill="#8D5DBB" opacity=".07"/>
<circle cx="770" cy="260" r="115" fill="#C8A0FF" opacity=".05"/>

<!-- Desktop icons -->
<g font-family="monospace" font-size="13" text-anchor="middle" fill="#DDD0F2">
  <rect x="35" y="48" width="78" height="82" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <rect x="56" y="64" width="36" height="27" rx="5" fill="#BFA0F1"/>
  <rect x="56" y="64" width="36" height="8" rx="3" fill="#E5C9FF"/>
  <text x="74" y="111">about.exe</text>

  <rect x="35" y="151" width="78" height="82" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <path d="M54 174h15l5 5h21v25H54z" fill="#D8B4FE"/>
  <text x="74" y="218">projects</text>

  <rect x="35" y="254" width="78" height="82" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <rect x="55" y="269" width="39" height="28" rx="5" fill="#382750" stroke="#C8A6F0"/>
  <text x="74" y="288" fill="#DCC3FF">&gt;_</text>
  <text x="74" y="321">terminal</text>

  <rect x="35" y="357" width="78" height="82" rx="12" fill="#FFFFFF" fill-opacity=".06"/>
  <path d="M74 373c-18-17-33 9 0 29 33-20 18-46 0-29z" fill="#EAA5CE"/>
  <text x="74" y="424">favorites</text>
</g>

<!-- Main window -->
<g filter="url(#shadow)">
  <rect x="185" y="85" width="650" height="365" rx="14" fill="url(#panel)" stroke="#73568F"/>
  <path d="M199 85h622q14 0 14 14v32H185V99q0-14 14-14z" fill="#3C2A55"/>
  <circle cx="208" cy="109" r="6" fill="#E994AE"/>
  <circle cx="229" cy="109" r="6" fill="#F0CC91"/>
  <circle cx="250" cy="109" r="6" fill="#A7D7BE"/>
  <text x="510" y="114" text-anchor="middle" font-family="monospace" font-size="14" fill="#E8D8F8">welcome.exe — Emily OS</text>
</g>

<g font-family="monospace">
  <text x="225" y="175" fill="#A8DCC5" font-size="14">$ initializing emily.exe ...</text>
  <text x="225" y="204" fill="#C5AEDF" font-size="13">[ OK ] loading creative universe</text>
  <text x="225" y="230" fill="#C5AEDF" font-size="13">[ OK ] developer profile found</text>
  <text x="225" y="281" fill="#E8CFFF" font-size="42" font-weight="bold">hello, i'm emily ♡</text>
  <text x="225" y="314" fill="#CDBBE2" font-size="17">a little universe made of code.</text>
  <text x="225" y="354" fill="#E9A9D7" font-size="14">✦ developer  /  dreamer  /  creator</text>
  <rect x="225" y="378" width="210" height="39" rx="8" fill="#A77CD2"/>
  <text x="330" y="403" text-anchor="middle" fill="#1C132A" font-size="14" font-weight="bold">SYSTEM ONLINE ♡</text>
</g>

<!-- Taskbar -->
<rect x="0" y="515" width="1000" height="55" fill="#141020" fill-opacity=".96"/>
<rect x="18" y="524" width="39" height="36" rx="10" fill="#3E2B57"/>
<text x="37" y="549" text-anchor="middle" fill="#E8CEFF" font-size="21">✦</text>
<text x="77" y="547" font-family="monospace" fill="#DCC9F1" font-size="15">Emily.exe OS</text>
<rect x="230" y="524" width="112" height="36" rx="8" fill="#3A2B4D"/>
<text x="286" y="547" font-family="monospace" text-anchor="middle" fill="#E9D8FF" font-size="13">welcome</text>
<text x="835" y="547" font-family="monospace" fill="#DCC9F1" font-size="14">♡  ✦  online</text>
</svg>
